server:
    ip-freebind: yes
    interface: 127.0.0.1@53
    interface: 127.0.0.1@853
    interface: 127.0.0.1@443
    interface: 10.10.10.20@53
    interface: 10.10.10.20@853
    interface: 10.10.10.20@443

    access-control: 127.0.0.0/8 allow
    access-control: 10.10.10.0/24 allow

    tls-service-key: "/etc/unbound/certs/dns.key"
    tls-service-pem: "/etc/unbound/certs/dns.crt"
    tls-port: 853
    https-port: 443

    private-domain: "lab.test"
    # À RETIRER quand DNSSEC sera actif sur lab.test
    domain-insecure: "lab.test"

    verbosity: 1
    log-queries: no

forward-zone:
    name: "lab.test."
    forward-addr: 10.10.20.30
    forward-addr: 10.10.20.31
