server:
    interface: 127.0.0.1@53
    interface: 192.168.56.10@53
    interface: 127.0.0.1@853
    interface: 192.168.56.10@853
    interface: 127.0.0.1@443
    interface: 192.168.56.10@443

    access-control: 127.0.0.0/8 allow
    access-control: 192.168.56.0/24 allow

    tls-service-key: "/etc/unbound/certs/dns.key"
    tls-service-pem: "/etc/unbound/certs/dns.crt"
    tls-port: 853     # DoT
    https-port: 443   # DoH

    verbosity: 1
    log-queries: no    
