# Drop-in pour le RESOLVER (10.10.10.20) :
#   sudo cp dnssec-lab.conf /etc/unbound/unbound.conf.d/
#   sudo unbound-checkconf && sudo systemctl restart unbound
server:
    # Validation DNSSEC active (validateur avant l'itérateur)
    module-config: "validator iterator"

    # Ancre de confiance de lab.test : le DS de la KSK (pas de zone parente
    # signée pour un domaine de labo, donc on l'ancre directement ici).
    trust-anchor-file: "/etc/unbound/lab.test.ds"

    # Unbound bloque par défaut le TLD réservé "test." (RFC 6761) :
    # sans cette ligne, lab.test ne serait jamais résolu.
    local-zone: "test." nodefault

    # Refuser les réponses dont les signatures ont été retirées
    harden-dnssec-stripped: yes
    # Ne PAS mettre lab.test dans domain-insecure (cela désactiverait la validation)

    # Journaliser la raison des échecs de validation (utile pour la démo)
    val-log-level: 2

# Le stub-zone vers les serveurs autoritaires est configuré par Malek.
# S'il n'existe pas encore, décommenter :
# stub-zone:
#     name: "lab.test"
#     stub-addr: 10.10.10.30
#     stub-addr: 10.10.10.31
