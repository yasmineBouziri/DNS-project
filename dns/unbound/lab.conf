server:
    interface: 127.0.0.1
    interface: 10.10.10.20

    port: 53

    do-ip4: yes
    do-ip6: no

    access-control: 127.0.0.0/8 allow
    access-control: 10.10.10.0/24 allow
    access-control: 0.0.0.0/0 refuse

    domain-insecure: "lab.test."

    hide-identity: yes
    hide-version: yes

    local-zone: "test." transparent

forward-zone:
    name: "lab.test."
    forward-addr: 10.10.20.30
